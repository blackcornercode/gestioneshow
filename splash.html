<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 500;
        }
        .progress-container {
            width: 80%;
            height: 8px;
            background-color: #333;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #007acc, #00d2ff);
            animation: loading 1.5s infinite ease-in-out;
            border-radius: 4px;
        }
        @keyframes loading {
            0% { width: 0%; transform: translateX(-100%); }
            50% { width: 100%; transform: translateX(0); }
            100% { width: 0%; transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <h2>Caricamento in corso...</h2>
    <div class="progress-container">
        <div class="progress-bar"></div>
    </div>
</body>
</html>
